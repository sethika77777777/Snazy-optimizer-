name: Build Android App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Clean Project and Restore Dependencies
        run: |
          mkdir -p temp_backup
          if [ -d "lib" ]; then cp -r lib temp_backup/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml temp_backup/; fi

          flutter create . --org com.snazy.optimizer --project-name snazy_optimizer --platforms android

          if [ -d "temp_backup/lib" ]; then rm -rf lib && cp -r temp_backup/lib .; fi
          if [ -f "temp_backup/pubspec.yaml" ]; then cp temp_backup/pubspec.yaml .; fi

          # Automatically add back installed_apps and battery_plus to pubspec.yaml if they are missing
          PUB_FILE="pubspec.yaml"
          if [ -f "$PUB_FILE" ]; then
            if ! grep -q "installed_apps:" "$PUB_FILE"; then
              sed -i '/dependencies:/a \  installed_apps: ^0.10.6' "$PUB_FILE" || true
            fi
            if ! grep -q "battery_plus:" "$PUB_FILE"; then
              sed -i '/dependencies:/a \  battery_plus: ^5.1.2' "$PUB_FILE" || true
            fi
          fi

          # Fix the kotlin_version line in android/app/build.gradle
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i '/kotlin_version/d' "$BUILD_GRADLE" || true
          fi
      
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
