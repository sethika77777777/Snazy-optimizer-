name: Build Android App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: "stable"

      - name: Generate Android platform
        run: |
          flutter create . \
            --org com.sethikadv.snazy \
            --project-name snazy_optimizer \
            --platforms android

      - name: Fix Gradle version
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Gradle Wrapper ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Fix Kotlin version
        run: |
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '1.9.22'/" android/settings.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle || true

      - name: Configure Firebase (google-services)
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::android/app/google-services.json is missing."
            exit 1
          fi

          if ! grep -q "com.google.gms.google-services" android/settings.gradle; then
            sed -i '/id "dev.flutter.flutter-plugin-loader"/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          fi

          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Gradle version
        run: |
          cd android
          ./gradlew --version

      - name: Build APK
        run: flutter build apk --release

      - name: Check APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK BUILD SUCCESSFUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snazy-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
