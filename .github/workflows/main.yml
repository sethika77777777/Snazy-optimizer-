name: Build Android App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Full Clean, Recreate Android & Fix All Errors
        run: |
          # 1. Remove all problematic and broken screen/service files
          rm -f lib/screens/safe_apps_screen.dart || true
          rm -f lib/screens/game_select_screen.dart || true
          rm -f lib/services/apps_service.dart || true

          # 2. Clean up any accidental mentions/imports of deleted packages in all Dart files
          if [ -d "lib" ]; then
            find lib -type f -name "*.dart" -exec sed -i '/battery_plus/d' {} + || true
            find lib -type f -name "*.dart" -exec sed -i '/installed_apps/d' {} + || true
          fi

          # 3. Clean up pubspec.yaml dependencies
          if [ -f "pubspec.yaml" ]; then
            sed -i '/installed_apps/d' pubspec.yaml || true
            sed -i '/battery_plus/d' pubspec.yaml || true
          fi

          # 4. Re-create android platform files to guarantee Manifest and v2 embedding exist
          flutter create . --org com.snazy.optimizer --project-name snazy_optimizer --platforms android

          # 5. Prevent kotlin_version crash by cleaning build.gradle
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i '/kotlin_version/d' "$BUILD_GRADLE" || true
          fi
      
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
