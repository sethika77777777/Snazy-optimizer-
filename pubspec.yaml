name: snazy
description: "Snazy - Root & Non-Root Gaming Performance Optimizer"
publish_to: 'none'
version: 1.0.10+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  installed_apps: ^1.4.1        # lists installed apps, icons, launch by package
  permission_handler: ^11.3.1   # storage / usage-stats permission requests
  shared_preferences: ^2.2.3    # persist safe-list, selected game, frozen apps, prefs
dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
