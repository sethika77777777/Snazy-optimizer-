name: Build Android App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: "stable"

      - name: Generate Android platform
        run: |
          flutter create . \
            --org com.snazy.optimizer \
            --project-name snazy_optimizer \
            --platforms android

      - name: Fix Kotlin configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          text = text.replace(
              "implementation \"org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version\"",
              "implementation \"org.jetbrains.kotlin:kotlin-stdlib:1.9.22\""
          )

          text = text.replace(
              "implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version'",
              "implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'"
          )

          text = text.replace(
              "implementation \"org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version\"",
              "implementation \"org.jetbrains.kotlin:kotlin-stdlib:1.9.22\""
          )

          text = text.replace(
              "implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version'",
              "implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'"
          )

          gradle.write_text(text)
          print("Kotlin dependency fixed.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Verify project files
        run: |
          echo "=== Android Manifest ==="
          test -f android/app/src/main/AndroidManifest.xml
          echo "AndroidManifest.xml FOUND"

          echo "=== Dashboard Screen ==="
          test -f lib/screens/dashboard_screen.dart
          echo "dashboard_screen.dart FOUND"

          echo "=== Project files ==="
          ls -la lib/screens

      - name: Build APK
        run: flutter build apk --release

      - name: Check APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK BUILD SUCCESSFUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snazy-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
