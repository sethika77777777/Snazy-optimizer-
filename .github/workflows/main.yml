name: Build Android App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: "stable"

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Verify source files
        run: |
          echo "=== lib/screens ==="
          ls -la lib/screens
          echo "=== DashboardScreen file ==="
          test -f lib/screens/dashboard_screen.dart
          echo "dashboard_screen.dart FOUND"
          echo "=== SplashScreen import ==="
          sed -n '1,50p' lib/screens/splash_screen.dart

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snazy-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
