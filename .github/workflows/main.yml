name: Build Android App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Clean Flutter Project and Replace Lib
        run: |
          # Save the current lib and pubspec if they exist
          mkdir -p temp_backup
          if [ -d "lib" ]; then cp -r lib temp_backup/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml temp_backup/; fi

          # Create a fresh flutter project named 'app'
          flutter create . --org com.snazy.optimizer --project-name snazy_optimizer --platforms android

          # Restore the user's lib and pubspec
          if [ -d "temp_backup/lib" ]; then rm -rf lib && cp -r temp_backup/lib .; fi
          if [ -f "temp_backup/pubspec.yaml" ]; then cp temp_backup/pubspec.yaml .; fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
