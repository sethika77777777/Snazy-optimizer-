name: Build Android App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Clean Project and Fix Gradle Kotlin Version
        run: |
          mkdir -p temp_backup
          if [ -d "lib" ]; then cp -r lib temp_backup/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml temp_backup/; fi

          flutter create . --org com.snazy.optimizer --project-name snazy_optimizer --platforms android

          if [ -d "temp_backup/lib" ]; then rm -rf lib && cp -r temp_backup/lib .; fi
          if [ -f "temp_backup/pubspec.yaml" ]; then cp temp_backup/pubspec.yaml .; fi

          # Remove battery_plus from any dart files if present
          if [ -d "lib" ]; then
            find lib -type f -name "*.dart" -exec sed -i '/battery_plus/d' {} + || true
          fi

          # Fix the kotlin_version line in android/app/build.gradle
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/kotlin_version/ext.kotlin_version/g' "$BUILD_GRADLE" || true
            sed -i '/kotlin_version/d' "$BUILD_GRADLE" || true
          fi
      
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
