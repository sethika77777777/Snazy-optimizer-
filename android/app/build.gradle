plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"

    // Firebase Google Services
    id "com.google.gms.google-services"
}

def flutterVersionCode = '2'
def flutterVersionName = '2.0.0'

android {
    namespace "com.sethikadv.snazy"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Shizuku AIDL support
    buildFeatures {
        aidl true
        buildConfig false
    }

    defaultConfig {
        applicationId "com.sethikadv.snazy"

        // Android 10+
        minSdkVersion 29
        targetSdkVersion 34

        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // Temporary debug signing for GitHub Actions build
            signingConfig signingConfigs.debug

            // Release optimization
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"

    // AndroidX
    implementation "androidx.core:core-ktx:1.12.0"

    // Google Play Core
    // Required by Flutter Play Store split compatibility
    // and fixes R8 missing SplitCompatApplication
    implementation "com.google.android.play:core:1.10.3"

    // Shizuku
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
