name: Build Android App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean Up Code and Dependencies
        run: |
          # Remove problematic screen/service files if they exist
          rm -f lib/screens/safe_apps_screen.dart || true
          rm -f lib/services/apps_service.dart || true

          # Remove any accidental battery_plus or installed_apps imports from all dart files
          if [ -d "lib" ]; then
            find lib -type f -name "*.dart" -exec sed -i '/battery_plus/d' {} + || true
            find lib -type f -name "*.dart" -exec sed -i '/installed_apps/d' {} + || true
          fi

          # Remove unused dependencies from pubspec.yaml
          if [ -f "pubspec.yaml" ]; then
            sed -i '/installed_apps/d' pubspec.yaml || true
            sed -i '/battery_plus/d' pubspec.yaml || true
          fi

          # Fix kotlin_version in build.gradle
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i '/kotlin_version/d' "$BUILD_GRADLE" || true
          fi
      
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
